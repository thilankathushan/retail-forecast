name: retail-forecast
services:
  api:
    build: .
    image: retail-forecast-local:latest
    environment:
      RETAIL_APP_BUNDLE: /artifacts/bundle.json
    volumes:
      - type: bind
        source: ${RETAIL_ARTIFACT_DIR:-./artifacts/uci/application}
        target: /artifacts
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${RETAIL_API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/meta', timeout=30).read()"]
      interval: 20s
      timeout: 35s
      start_period: 60s
      retries: 3
  dashboard:
    image: retail-forecast-local:latest
    build: .
    command: [python, -m, streamlit, run, dashboard.py, --server.address, 0.0.0.0, --server.port, "8501", --server.fileWatcherType, none]
    environment:
      RETAIL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${RETAIL_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 3
