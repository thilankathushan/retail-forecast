name: Retail Forecast fixtures
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt -e .
      - run: python -m pip check
      - run: python -W error -m unittest discover -s tests -v
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-app-lock.txt
      - run: python -m pip install -c requirements-app-lock.txt -r requirements-app.txt
      - run: python -m pip check
      - run: python -W error -m unittest discover -s app_tests -v
