[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecast"
version = "0.1.0"
description = "One-week-ahead observed-sales forecasting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["pandas>=2.3.3,<4", "scikit-learn>=1.7.2,<2", "openpyxl>=3.1.5,<4", "numpy>=2.3.3,<3", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4", "matplotlib>=3.10,<4"]

[project.scripts]
retail-forecast = "retail_forecast.cli:main"

[tool.setuptools.packages.find]
include = ["retail_forecast*"]
